plugins {
    // AGP 9 内置 Kotlin：**不再声明 `org.jetbrains.kotlin.android`**
    // （声明了会直接报 "no longer required for Kotlin support since AGP 9.0"）
    id 'com.android.application'
    // Compose 编译器插件仍需单独应用（它挂在 Kotlin 编译器上，与内置 Kotlin 并存）
    id 'org.jetbrains.kotlin.plugin.compose'
    // 序列化插件：**不应用它的话 `@Serializable` 不会生成 serializer**，
    // `Xxx.serializer()` 直接编译不过（报 Unresolved reference 'serializer'）。
    // 根 build.gradle 的 buildscript classpath 已备好该插件，这里只需声明。
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// 版本号单一来源：android/version.properties（发版只改那一个文件）
def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }

android {
    // 与 :app 不同的包名 —— 原生版与 WebView 版可同时安装在同一台机器上做对照。
    // 注意：namespace 不能用 `...k.native` —— **`native` 是 Java 关键字**，
    // AGP 会直接拒绝（"is not a valid Java package name as 'native' is a Java keyword"）。
    namespace = "top.kuangdada.k.nativeapp"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "top.kuangdada.k.nativeapp"
        // minSdk 27：Compose + WebRTC + 现代 AndroidX 的舒适下限。
        // 不用 24：会引入一堆 core library desugaring 与 Compose/AndroidX 的兼容补丁，
        // 而本项目自有渠道的装机分布里 24–26 占比极低（要改的话改这一行即可）。
        minSdkVersion 27
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionProps['versionCode'].toInteger()
        versionName versionProps['versionName']

        // 服务器地址单一来源（见 docs/android-native-rewrite-plan.md §9 Q1）
        // 生产 Web 服务器带 www —— deep link 的 Manifest intent-filter 同时声明 www 与裸域
        buildConfigField "String", "SERVER_URL", '"https://www.kuangdada.top"'
    }

    // 发布签名。keystore 与口令**都不入库**（见 .gitignore）。
    // 路径从 `app/k-release.keystore` 移到 `android/k-release.keystore` ——
    // 原来放在 :app 目录里，而 :app 已在 M4 移除；**不搬的话删目录会永久丢失发布私钥**
    // （丢了就无法原地覆盖安装更新，只能换 applicationId 重新上架）。
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def releaseKeystore = rootProject.file('k-release.keystore')
    def hasReleaseSigning = releaseKeystore.exists() && keystorePropsFile.exists()

    signingConfigs {
        release {
            storeFile releaseKeystore
            storePassword keystoreProps['storePassword'] ?: ''
            keyAlias keystoreProps['keyAlias'] ?: 'k-native'
            keyPassword keystoreProps['keyPassword'] ?: ''
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    buildTypes {
        debug {
            // 与 release 包可并存安装（不同 applicationId），便于真机对照调试
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            // 同样改成显式赋值：`shrinkResources` / `signingConfig` 是 Gradle 管理的属性，
            // Groovy 的空格调用语法在 Gradle 9 已弃用、10 会移除（`minifyEnabled` 是普通
            // boolean，不受影响 —— 所以只有这两行报警告，别把这一行也一起"顺手改错"）
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
        jniLibs {
            // WebRTC 会把每个 ABI 的原生库都打进来。全带上 APK 会到 60MB+；
            // 排除 x86/x86_64（只用于模拟器）后大约省掉一半。
            //
            // 为什么不用 `ndk { abiFilters }`：AGP 9 起那个写法不再影响打包
            // （实测加了之后 APK 仍然是全 ABI，63MB 没变），必须在这里显式排除。
            excludes += ['lib/x86/**', 'lib/x86_64/**']
            // 保留 arm64-v8a（2016 年后几乎全部手机）与 armeabi-v7a（老设备兜底）
            //
            // 这里**不再覆写 useLegacyPackaging**，用 AGP 默认值（release=false：.so 不压缩、
            // 直接从 APK mmap 加载）。曾经为了排查"release 进语音房 SIGTRAP"把它改成 true，
            // 事后证明与打包无关 —— 真正原因是 R8 把 jni_zero 的 bootstrap 类 shrink 掉了，
            // 详见 proguard-rules.pro 里的完整排查记录。
        }
    }
}

kotlin {
    // 与 compileOptions 的 Java 21 对齐
    jvmToolchain(21)
}

// 本模块的 Kotlin 单测不走 Gradle 测试任务：
// 工程路径含中文时 Gradle 给测试 worker 传 classpath 用 @argfile（UTF-8 写、ANSI 读）→
// 中文路径变乱码 → ClassNotFoundException。绕法见 android/scripts/run-kotlin-tests.mjs。
tasks.configureEach { t ->
    if (t.name in ['test', 'testDebugUnitTest', 'testReleaseUnitTest']) {
        t.enabled = false
    }
}

// 与 :app / :core:data 同一套：导出测试 classpath 给 android/scripts/run-kotlin-tests.mjs
tasks.register('dumpTestClasspath') {
    group = 'verification'
    description = '导出单元测试 runtime classpath（供 Node 侧直接跑 JUnit 用）'
    dependsOn 'compileDebugUnitTestKotlin'
    def outputFile = layout.buildDirectory.file('kotlin-test-classpath.txt')
    outputs.file(outputFile)
    doLast {
        def testTask = tasks.named('testDebugUnitTest').get()
        def entries = testTask.classpath.files
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.setText(entries.join(File.pathSeparator), 'UTF-8')
        logger.lifecycle("[dumpTestClasspath:native] ${entries.size()} 个条目 → ${file.absolutePath}")
    }
}

dependencies {
    // 注意：构建日志里那条 "Using a Project object as a dependency notation has been deprecated"
    // **不是这两行引起的** —— 带 --stacktrace 实测，它来自 AGP 自己的
    // com.android.build.gradle.internal.dependency.VariantDependenciesBuilder（测试组件那条依赖），
    // 也就是说它是 AGP 9.1.0 与 Gradle 9.7 之间的债，项目侧改不了（详见
    // docs/android-build-warnings.md 第三节）。
    implementation project(':core:designsystem')
    implementation project(':core:data')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.compose

    // 图片加载（Compose 原生 + OkHttp 引擎，复用同一套超时/UA 语义）
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    // 语音房：WebRTC（音频采集/编解码/回声消除都在这里）
    implementation libs.webrtc.android

    // 视频播放（帖子里的视频）：ExoPlayer + 官方播放控件（进度条/暂停/全屏都由它提供）
    implementation libs.media3.exoplayer
    implementation libs.media3.ui

    // 毛玻璃（背景实时模糊）：二级页顶栏 + 导航胶囊。
    // 用 Kyant0 的 backdrop（Compose 版液态玻璃）：内容挂 `layerBackdrop`、栏挂
    // `drawBackdrop + effects { blur() }`。为什么不继续自研、以及本机踩过的坑，
    // 见 docs/android-glass-plan.md §12（机制实测）与 §15（选型结论）。
    // 注意：效果依赖 RenderEffect（Android 12+）→ minSdk 27 的低版本必须自己兜纯色。
    implementation libs.backdrop

    // 这里曾有 `implementation libs.androidx.biometric` —— 只服务「私密文件夹」的生物识别解锁，
    // 该功能 09-18 整体删除后依赖一并撤掉（它也是 `androidx.fragment` 的来源，
    // 所以 MainActivity 的基类同时从 FragmentActivity 回到 ComponentActivity）。

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.runtime
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3

    debugImplementation libs.androidx.compose.ui.tooling

    testImplementation libs.junit
}







