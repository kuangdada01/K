// ============================================================
// Compose 稳定性配置（B3，2026-10-11）
// ============================================================
// 格式（以本工程 Kotlin 2.4.20 的 compose 编译器插件实测为准，与网上常见的
// `stable class X` 写法**不同**——那是旧版/他版格式，这里每行一个裸模式，
// 支持 `*` 通配；注释只能是 // 且必须在行首，# 会被当成模式报错）：
//   top.kuangdada.k.core.data.model.*
//
// 为什么需要它：:core:data 的 DTO（Post.images 等）含 List<String> 字段，
// Compose 编译器默认把 List 与含 List 的 data class 一律判为**不稳定类型**，即
// PostCard / 会话行 / 聊天气泡在父级任何重组里都无法 skip（系统性重组缺口）。
//
// 安全性依据：这些 DTO 与 UI 模型全部是 **val + 不可变 List 的 data class**
// （Kotlin 的 List 接口本身只读，持有方从不原地修改），"当作 stable"与实际
// 不可变性一致 —— 不存在"实例被改而 UI 不刷新"的漏刷风险。
//
// 生效范围：本文件只挂在 :native 的 composeCompiler 上（全部页面组合都在
// :native；:core:designsystem 不依赖 :core:data，无消费点）。
// 改动后跑一次 compileDebugKotlin，用 reportsDestination 输出的
// *-classes.txt 核对核心卡片参数是否真的 stable（写下去不等于生效，报告才算数）。

// DTO（:core:data 的模型包）
top.kuangdada.k.core.data.model.*

// UI 模型（:core:data 根包：PostUi 与 MessageRepository 的嵌套 Ui 类）
top.kuangdada.k.core.data.PostUi
top.kuangdada.k.core.data.MessageRepository.*

// 只读集合：元素类型已由上面两条覆盖（String / model / Ui 全 stable）
kotlin.collections.List
