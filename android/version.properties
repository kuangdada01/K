# 版本号单一来源（由 native/build.gradle 读取；发版时改这里）
#
# ⚠️ 三处必须同步改，否则 App 内更新提示会指向错误的版本：
#   · .env 的 APP_VERSION / APP_APK_URL / APP_UPDATE_NOTES（服务端 /api/app/version 的数据源）
#   · 服务器上实际的 APK 文件名：client/dist/apk/k-app-<versionName>-release.apk
#   · 本地待发布的包：client/public/apk/k-app-<versionName>-release.apk（构建时会带进 dist/）
# 服务端 .env 改完要 `pm2 delete && pm2 start`（`pm2 restart` 不重读 .env）。
versionCode=14
versionName=0.1.13
