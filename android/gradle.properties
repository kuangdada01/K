# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# AndroidX package structure
android.useAndroidX=true

# compileSdk 37 的超前声明
# AGP 9.1.0 官方只测到 compile SDK 36.1，编译 37 会打一条 "We recommend using a newer
# Android Gradle plugin to use compile SDK version 37.0"。这不是错误，AGP 自己的提示里
# 给的就是这个开关。加它 = 明确"知道版本超前、继续用"，而不是把问题藏起来：
# 真出现 AGP 不认 37 的构建问题时，应当升级 AGP 并删掉这一行。
android.suppressUnsupportedCompileSdk=37.0

# Allow building from a path containing non-ASCII (Chinese) characters on Windows
# 注意：只解决了 AGP 的路径检查。**Gradle 的测试 worker 仍会因中文路径挂掉**：
# classpath 走 @argfile（UTF-8 写）而 java 启动器按系统 ANSI（GBK）读，中文路径变乱码 →
# `gradlew test` 报 ClassNotFoundException。Kotlin 单测请用 `npm run android:test`
# （Node 直接起 JUnit，绕开 argfile），详见 android/scripts/run-kotlin-tests.mjs。
#
# 这条会打 "The option setting 'android.overridePathCheck=true' is experimental"，
# 且 AGP 没有非实验的同类开关 —— 去掉它构建会直接失败在这个中文路径上（已实测，
# 见 docs/android-build-warnings.md 第二节）。也就是说这条警告是
# **中文工程路径的结构性代价**，不是可以清掉的债。
android.overridePathCheck=true

# Kotlin：项目级持久数据目录（不要入库，见 .gitignore）
# kotlin.project.persistent.dir=.kotlin
