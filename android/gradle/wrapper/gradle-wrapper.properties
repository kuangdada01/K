distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.7.0：AGP 9.1.0 要求 Gradle >= 9.3.1；取 9.7.0 是因为它同时落在
# Kotlin 2.4.20 的兼容区间内（官方表：2.4.20 支持 Gradle 7.6.3–9.7.0），
# 一次升到位，避免之后为升 AndroidX 再动一次 wrapper。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.7.0-all.zip
# 分发包哈希校验（值来自官方 services.gradle.org 的 gradle-9.7.0-all.zip.sha256，
# 镜像与官方分发内容一致；被篡改的分发会直接下载失败而不是悄悄跑起来）
distributionSha256Sum=a9ecb5ac5c2ca40691e6527724d11d0b43b8c0a52825b77c09899f2a72d2d2bf
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
