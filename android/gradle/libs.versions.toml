[versions]
# ---------------------------------------------------------------
# 工具链
# AGP 9.1.0 + Gradle 9.1.0 + Kotlin 2.4.20 + compileSdk 37 + JDK 21
#
# 为什么从 8.13.0 升上来：AndroidX / Compose 的 2026 年版本（compose-ui 1.12.x、
# lifecycle 2.11、activity 1.13 等）已经普遍要求 "AGP 9.1.0 or higher" 且
# compileSdk >= 37。留在 AGP 8 就只能把整套库降级去迁就旧工具链 ——
# 那是本末倒置，所以直接升工具链。
# ---------------------------------------------------------------
agp = "9.1.0"
kotlin = "2.4.20"

# ---------------------------------------------------------------
# AndroidX / Compose
# Compose BOM 决定整套 compose-* 的版本，单独写版本号会漂移
# ---------------------------------------------------------------
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation = "2.10.1"

# --- 网络 / 序列化 ---
# Retrofit 3.0.0 + OkHttp 5.5.0 + kotlinx-serialization-json 1.9.0
# 注意：serialization-json 的运行时**刻意不取最新**（1.11.0 对应更新的 Kotlin），
# 本工程 Kotlin 是 2.4.20；插件随 Kotlin 同版本，运行时用 1.9.0 这条已验证的组合。
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.9.0"

# --- 存储 / 图片 / 实时音频 ---
securityCrypto = "1.1.0"
datastore = "1.2.1"
coil = "3.6.2"

# 毛玻璃（背景实时模糊）。1.7.3 = 1.x 稳定线（API 是 hazeSource / hazeEffect / HazeStyle）。
# ★ 2026-09-21 复盘后的用法约定：页面内的 hazeSource/hazeEffect 必须挂在"页面转场落定之后"
# （用 isPageTransitioning() 门控，见 docs/android-topbar-blur-findings.md 第 7 节）——
# haze 的 positionOnScreen 缓存会被绘制期转场污染，这是当年"顶栏只有色膜没有模糊"的根因。
# 顶栏背景模糊（Compose 原生）：位图捕获 + 自带 GL/AGSL 管线 ——
# 本机 OnePlus ROM 对"层套层 + RenderEffect"的模糊腿是空操作（haze 全系实测不糊），
# Cloudy 是进程内唯一实测能糊的实现。1.0.0-alpha01（作者标注 alpha）。

exifinterface = "1.4.2"

# --- 毛玻璃（背景实时模糊）---
# Kyant0/AndroidLiquidGlass 的发布名 = io.github.kyant0:backdrop（Compose Multiplatform）。
# 为什么用它而不是自研：它的 API 形态正好是"内容挂 layerBackdrop、栏挂 drawBackdrop + effects{blur()}"，
# 而且它把"背景在源之外"的情况（backdrop 里先 drawRect 底色）也处理了。
# 依赖 RenderEffect（Android 12+），lens 需要 13+；本项目 minSdk 27 → 低版本必须自己兜纯色。
# 选它的直接原因见 docs/android-glass-plan.md §15。
backdrop = "2.0.1"
# WebRTC（语音房）。
# 用 io.github.webrtc-sdk:android 而不是官方的 org.webrtc:google-webrtc ——
# 后者停在 1.0.32006（2021 年），已无人维护；这个 fork 跟随上游 WebRTC 分支持续发版。
# 取 144.7559.15 而不是最新的 150.x：150 分支较新，本项目还没有真机验证条件，
# 先用 144 这条更成熟的线；升级时只改这一行。
webrtc = "144.7559.15"

# 这里曾有 `biometric = "1.1.0"`（私密文件夹的生物识别解锁）。
# 该功能 09-18 整体删除，版本号与别名（androidx-biometric）一并撤掉。

# 视频播放（帖子里的视频）。用 media3（ExoPlayer 的官方归宿）：
# 自己拿 MediaPlayer + SurfaceView 做的话，缓冲/seek/横竖屏/后台暂停这些都要手写，
# 而这正是"能播"和"播得好"的差距所在。
#
# 1.8.0 → 1.11.1（跨 3 个小版本）。升它的理由是我们**对得上号的几条修复**：
#  · 修复 `TrackSelector` 实例未被释放（**内存泄漏** —— 信息流一屏多个 ExoPlayer 实例，最敏感）；
#  · MP4 支持 fragmented MP4 用 `mfra` 定位 seek（用户上传经服务端 ffmpeg 转码，
#    fMP4 产物在 1.8.0 下 seek 会失效/跳错位置）；
#  · 修复给 renderer 设置新 surface 时首帧尺寸错误；
#  · 修复 `VideoFrameReleaseHelper` 在 display 变化时的错帧/卡顿；
#  · 修复从解码器错误恢复时可能崩溃；帧率估算更准（掉帧/音画不同步）。
#
# 风险评估（实测，不是推测）：我们只用 ExoPlayer.Builder / MediaItem.fromUri /
# Player 回调 / PlayerView(setShowBuffering) / AspectRatioFrameLayout，
# 而 PlayerView 在两个版本里几乎逐字节相同（40701 vs 40726 字节）；
# 1.9–1.11 的破坏性改动（FrameExtractor / DefaultPreloadManager /
# EditedMediaItemSequence / HLS / Cast / MetadataRetriever）**一个都不在我们的路径上**。
# `minCompileSdk` 由 35 抬到 36 —— 本工程 compileSdk 37，不阻塞。
media3 = "1.11.1"

junit = "4.13.2"

[libraries]
# --- core ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- compose（版本由 BOM 提供） ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# --- test ---
junit = { module = "junit:junit", version.ref = "junit" }

# --- 网络 ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- 存储 ---
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 图片 EXIF 方向（压缩时必须烘焙进像素，否则上传后照片会躺倒）
# 1.4.1 → 1.4.2：小补丁；同时 media3 也依赖 exifinterface，升 media3 时版本自然对齐，
# 少一次类路径上的版本分歧。
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# --- 图片 ---
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# --- 毛玻璃（hazeSource/hazeEffect/HazeTint；HazeMaterials 不用 —— 直接调 tint 精确配主题） ---

# --- 毛玻璃（Compose）：背景捕获 + RenderEffect 效果链（blur / lens / vibrancy / 色调） ---
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }


# --- 实时音频 ---
webrtc-android = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

# --- 视频 ---
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }







