<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霜晨月 · 玄夜鎏金配色预览</title>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --surface-soft: #1e232d;
      --text: #e8e6e1;
      --text-soft: #a8abaf;
      --muted: #6d7178;
      --line: #262b35;
      --gold: #c9a962;
      --gold-soft: #2a2620;
      --danger: #e0586b;
      --shadow: 0 18px 50px rgba(0, 0, 0, .45);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: MiSans, "Noto Serif SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 85% -10%, rgba(201, 169, 98, .10), transparent 42%),
        var(--bg);
      color: var(--text);
    }

    button { font: inherit; }

    .layout {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 620px) 280px;
      gap: 28px;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 14px;
      border-right: 1px solid rgba(38, 43, 53, .9);
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 28px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #c9a962, #7a6335);
      color: #0d0f14;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    .nav {
      display: grid;
      gap: 4px;
    }

    .nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      color: var(--text-soft);
      text-decoration: none;
      transition: background .16s ease, color .16s ease;
    }

    .nav a:hover { background: rgba(30, 35, 45, .85); color: var(--text); }
    .nav a.active { background: var(--surface-soft); color: var(--gold); box-shadow: var(--shadow); }

    .nav i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      opacity: .72;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 14px;
      background: rgba(22, 26, 34, .8);
      border: 1px solid rgba(38, 43, 53, .9);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--g, linear-gradient(135deg, #3a4150, #c9a962));
      flex-shrink: 0;
      box-shadow: inset 0 0 0 2px rgba(232, 230, 225, .18);
    }

    .user-chip strong { display: block; font-size: 14px; }
    .user-chip small { color: var(--muted); }

    main { padding: 34px 0 90px; }

    .feed-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .feed-head h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    .feed-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .post {
      background: rgba(22, 26, 34, .88);
      border: 1px solid rgba(38, 43, 53, .95);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .post-head,
    .post-actions,
    .recommend-row {
      display: flex;
      align-items: center;
    }

    .post-head { gap: 12px; margin-bottom: 14px; }
    .post-head strong { display: block; font-size: 15px; }
    .post-head small { color: var(--muted); }

    .follow-btn {
      margin-left: auto;
      border: 1px solid rgba(201, 169, 98, .38);
      background: var(--gold);
      color: #0d0f14;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .follow-btn.soft {
      background: transparent;
      color: var(--gold);
    }

    .photo {
      height: 520px;
      border-radius: 18px;
      background:
        linear-gradient(to top, rgba(13, 15, 20, .30), transparent 42%),
        var(--g, linear-gradient(135deg, #3a4150, #59627a 48%, #0d0f14));
      position: relative;
      overflow: hidden;
    }

    .photo::after {
      content: attr(data-label);
      position: absolute;
      left: 16px;
      bottom: 14px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(13, 15, 20, .68);
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .08em;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(201, 169, 98, .28);
    }

    .post-actions {
      gap: 18px;
      padding: 14px 2px 0;
      color: var(--text-soft);
      font-size: 14px;
    }

    .post-actions button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      color: inherit;
    }

    .post-actions button:first-child { color: var(--danger); }

    .caption {
      padding: 10px 2px 0;
      color: var(--text-soft);
      line-height: 1.8;
      font-size: 14px;
    }

    .caption strong { color: var(--text); }

    .rightbar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 42px 0;
    }

    .panel {
      background: rgba(22, 26, 34, .82);
      border: 1px solid rgba(38, 43, 53, .95);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .12em;
      font-weight: 700;
    }

    .recommend-row {
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid rgba(38, 43, 53, .72);
    }

    .recommend-row:first-of-type { border-top: 0; }
    .recommend-row .avatar { width: 36px; height: 36px; }
    .recommend-row div { flex: 1; min-width: 0; }
    .recommend-row strong { display: block; font-size: 13px; }
    .recommend-row small { color: var(--muted); font-size: 12px; }

    .mini-btn {
      border: 0;
      background: var(--gold-soft);
      color: var(--gold);
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(201, 169, 98, .22);
    }

    @media (max-width: 1020px) {
      .layout { grid-template-columns: 200px minmax(0, 1fr); }
      .rightbar { display: none; }
    }

    @media (max-width: 720px) {
      .layout { display: block; width: min(100% - 24px, 620px); }
      .sidebar {
        position: fixed;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        top: auto;
        height: auto;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        border-right: 0;
        border-top: 1px solid rgba(38, 43, 53, 1);
        background: rgba(13, 15, 20, .92);
        backdrop-filter: blur(20px);
      }
      .brand, .sidebar-bottom { display: none; }
      .nav {
        display: flex;
        justify-content: space-around;
      }
      .nav a {
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        padding: 6px 8px;
      }
      main { padding: 22px 0 96px; }
      .photo { height: 420px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">霜</span>霜晨月</div>
      <nav class="nav" aria-label="主导航">
        <a class="active" href="#"><i></i>首页</a>
        <a href="#"><i></i>搜索</a>
        <a href="#"><i></i>消息</a>
        <a href="#"><i></i>分享</a>
        <a href="#"><i></i>公告</a>
        <a href="#"><i></i>图书</a>
        <a href="#"><i></i>主页</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="user-chip">
          <span class="avatar" style="--g:linear-gradient(135deg,#c9a962,#3a4150)"></span>
          <div><strong>k</strong><small>玄夜鎏金预览</small></div>
        </div>
      </div>
    </aside>

    <main>
      <div class="feed-head">
        <h1>首页</h1>
        <span>OBSIDIAN &amp; GOLD / SAME LAYOUT</span>
      </div>

      <article class="post">
        <header class="post-head">
          <span class="avatar" style="--g:linear-gradient(135deg,#3a4150,#c9a962)"></span>
          <div><strong>晨野</strong><small>22 分钟前 · 城市摄影</small></div>
          <button class="follow-btn">关注</button>
        </header>
        <div class="photo" data-label="夜色玻璃幕墙" style="--g:linear-gradient(135deg,#2b303c,#454d63 45%,#0d0f14)"></div>
        <div class="post-actions"><button>♡ 1,284</button><button>评论 96</button><button>转发 38</button><button>分享</button></div>
        <div class="caption"><strong>晨野</strong> 结构与原来完全一致：导航、卡片、操作栏、推荐位都在原处，只把配色换成深夜黑与鎏金。</div>
      </article>

      <article class="post">
        <header class="post-head">
          <span class="avatar" style="--g:linear-gradient(135deg,#c9a962,#6b5732)"></span>
          <div><strong>青柠</strong><small>1 小时前 · 阅读日常</small></div>
          <button class="follow-btn soft">已关注</button>
        </header>
        <div class="photo" data-label="灯下旧书页" style="--g:linear-gradient(135deg,#8a734b,#4a3d28 52%,#171310)"></div>
        <div class="post-actions"><button>♡ 2,040</button><button>评论 121</button><button>转发 57</button><button>分享</button></div>
        <div class="caption"><strong>青柠</strong> 暗色底上用金色做强调，边框更细更冷，让照片在黑金舞台上自己说话。</div>
      </article>
    </main>

    <aside class="rightbar">
      <section class="panel">
        <h2>推荐关注</h2>
        <div class="recommend-row">
          <span class="avatar" style="--g:linear-gradient(135deg,#59627a,#232837)"></span>
          <div><strong>洛书</strong><small>电子书与手记</small></div>
          <button class="mini-btn">关注</button>
        </div>
        <div class="recommend-row">
          <span class="avatar" style="--g:linear-gradient(135deg,#e0586b,#3a4150)"></span>
          <div><strong>白噪音</strong><small>音乐与影像</small></div>
          <button class="mini-btn">关注</button>
        </div>
        <div class="recommend-row">
          <span class="avatar" style="--g:linear-gradient(135deg,#7a8a6d,#2a2620)"></span>
          <div><strong>禾木</strong><small>胶片日记</small></div>
          <button class="mini-btn">关注</button>
        </div>
      </section>
    </aside>
  </div>
</body>
</html>
